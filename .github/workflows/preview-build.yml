# Unofficial preview builds of the frame-animation work, for people who want to try it without
# building from source: Windows x64, macOS Apple Silicon and Linux x86_64 (AppImage).
#
# A push to this branch builds all three and keeps them as run artifacts. Pushing a tag named
# preview-* also publishes them as a GitHub prerelease on this repository. The binaries are NOT
# signed or notarized (no certificates are configured here), and the bundled Craft fonts, which live
# in a private repository, are left out.
name: Preview build

on:
  push:
    branches: [frame-animation-preview]
    tags: ["preview-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          base=$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          suffix="${GITHUB_REF_NAME#preview-}"
          case "$GITHUB_REF" in refs/tags/preview-*) ;; *) suffix="dev.${GITHUB_RUN_NUMBER}" ;; esac
          # Only characters a semver pre-release allows.
          suffix=$(printf '%s' "$suffix" | tr -c 'A-Za-z0-9.' '.')
          echo "version=${base}-frame-animation.${suffix}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: preview-windows-x64
      - name: Apply version
        shell: bash
        run: cargo xtask version set "$VERSION"
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g "WixToolset.UI.wixext/5.0.2" "WixToolset.Util.wixext/5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*-portable.zip
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: preview-macos-arm64
      - name: Apply version
        run: cargo xtask version set "$VERSION"
      - name: Build and package (ad-hoc signed, not notarized)
        run: packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-macos-arm64
          path: dist/release/*.dmg
          if-no-files-found: error

  linux:
    name: Linux x86_64 AppImage
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config desktop-file-utils appstream python3-yaml zsync
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: preview-linux-x86_64
      - name: Apply version
        run: cargo xtask version set "$VERSION"
      - name: Build and package the AppImage
        run: packaging/linux/package.sh --formats appimage
      - name: Smoke test
        run: |
          for f in dist/release/*.AppImage; do
            chmod +x "$f"
            APPIMAGE_EXTRACT_AND_RUN=1 "$f" --version || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-linux-x86_64
          path: dist/release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/preview-')
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" assets/* \
            --prerelease \
            --title "PhotoCraft frame animation preview ($VERSION)" \
            --notes-file .github/preview-release-notes.md
